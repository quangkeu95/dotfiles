# Keep the standard prefix: press Ctrl-b, release, then press a command key.
set -g prefix C-b
bind C-b send-prefix

# Terminal support for Ghostty and Neovim.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:clipboard:extkeys"
set -s extended-keys on
set -g focus-events on
set -s escape-time 10
set -s set-clipboard external

# Comfortable defaults.
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# Easy splits that inherit the current pane's directory.
# Ctrl-b v: left/right panes. Ctrl-b h or s: top/bottom panes.
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Ctrl-b + Arrow: move between panes.
bind Left  select-pane -L
bind Down  select-pane -D
bind Up    select-pane -U
bind Right select-pane -R

# Option+Arrow: move between panes without pressing the prefix.
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# Ctrl-b H/J/K/L: resize; hold the direction key to repeat.
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

# Ctrl-b c: new window in the current directory.
bind c new-window -c "#{pane_current_path}"

# Ctrl-b X: close the current window after confirmation.
# Lowercase Ctrl-b x continues to close only the current pane.
bind X confirm-before -p "Close window #W? (y/n)" kill-window

# Vi-style copy mode.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Ctrl-b r reloads this file; Ctrl-g immediately detaches.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind -n C-g detach-client
