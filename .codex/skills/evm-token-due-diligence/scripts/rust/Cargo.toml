[package]
name = "evm-diligence"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
publish = false

# Keep this portable tool independent of any enclosing repository workspace.
[workspace]

[dependencies]
serde = "1.0"
serde_json = "1.0"
sha2 = "0.10"
num-bigint = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "evm-diligence"
path = "src/main.rs"
